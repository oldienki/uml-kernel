name: uml-kernel-image

# Builds and publishes oldienki/uml-kernel-6 to Docker Hub.
# Triggers on kernel-build file changes or manual dispatch.

on:
  push:
    paths:
      - Dockerfile
      - kernel.config
      - build-kernel-image.sh
      - .github/workflows/uml-image.yml
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build kernel image (and push if logged in)
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            ./build-kernel-image.sh --push
          else
            echo "DOCKERHUB_USERNAME not set — building without push"
            ./build-kernel-image.sh
          fi
